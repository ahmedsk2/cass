[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; Without these three sections supervisord still runs every program below, but
; `supervisorctl` cannot talk to it at all: it exits with "Error: .ini file does
; not include supervisorctl section", which is what `docker exec <app>
; supervisorctl status` did on the production host. The runbook and the launch
; checklist both ask for that command, and there is no other way to restart a
; wedged queue worker without redeploying the whole container.
;
; A unix socket, never an inet one: an HTTP port here would be reachable from
; anything on the compose network. /run rather than /tmp because /run is
; root-owned and not world-writable, so the `app` user cannot replace the socket
; with one of its own. 0700 leaves it root-only.
;
; That is what contains it. nginx and php-fpm below are started as root because
; a master has to be, but every process that serves a request or runs a job is
; the `app` user - nginx's workers and php-fpm's pool via the Dockerfile's
; seds, the queue worker and the scheduler via `user=app` here - and the smoke
; job in CI asserts none of them is root. So a compromise reached through the
; application cannot drive supervisor; only `docker exec`, which is already root
; on the host, can.
[unix_http_server]
file=/run/supervisor.sock
chmod=0700

; supervisorctl speaks XML-RPC to the socket above; without this factory the
; socket answers, but every method is "UNKNOWN_METHOD".
[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; supervisorctl's own default is http://localhost:9001, which nothing listens
; on. Point it at the socket so plain `supervisorctl status` works with no flags.
[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:php-fpm]
command=php-fpm -F
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g 'daemon off;'
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --memory=192
user=app
autorestart=true
; Migrations are applied by the owner after the container starts (never at
; boot), so on a fresh deploy the queue table won't exist yet and this
; process fails fast a few times in a row. The default startretries=3 would
; let supervisor give up permanently (FATAL) before the owner has a chance
; to migrate; a high ceiling keeps it retrying indefinitely instead.
startretries=1000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php /var/www/html/artisan schedule:work
user=app
autorestart=true
startretries=1000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
