# The /s/ path segment IS the author's credential, the /invite/ one is the
# invitee's, and a /files/ signature is a 30-minute credential (spec section 9).
# Keep all three out of the log stream Coolify collects; the status code and the
# client address are what triage needs. An /invite/ token is the widest of the
# three: it creates a pre-verified account at the invitee's address, and for an
# Owner invitation that is control of the organization.
map $request_uri $cass_logged_uri {
    "~^/s/[A-Za-z0-9]{64}"         "/s/[redacted]";
    "~^(?<cass_path>/files/[^?]*)" "$cass_path?[signed]";
    "~^/invite/[A-Za-z0-9]{64}"    "/invite/[redacted]";
    default                        $request_uri;
}

# Redacting the request line is only half of it. SecurityHeaders sends
# `Referrer-Policy: strict-origin-when-cross-origin`, which means a same-origin
# request carries the FULL referring URL - so every subresource the status page
# pulls and every /livewire/update POST it or the invitation page makes would
# otherwise write the same 64-character credential into this log, one field to
# the right. Only the two token paths are redacted here: an ordinary referer is
# triage data worth keeping. The capture names differ because nginx compiles
# every rule of one map into the same variable namespace.
map $http_referer $cass_logged_referer {
    ""                                                       "-";
    "~*^(?<cass_ref>https?://[^/]+)/s/[a-z0-9]{64}"          "$cass_ref/s/[redacted]";
    "~*^(?<cass_inv_ref>https?://[^/]+)/invite/[a-z0-9]{64}" "$cass_inv_ref/invite/[redacted]";
    default                                                  $http_referer;
}

log_format cass '$remote_addr - $remote_user [$time_local] '
                '"$request_method $cass_logged_uri $server_protocol" '
                '$status $body_bytes_sent "$cass_logged_referer" "$http_user_agent"';

server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;
    # Ten files at 10 MB is the most a conference may allow, and Livewire posts
    # all of them in one multipart request. Sized for that, not for one file.
    client_max_body_size 110m;

    access_log /dev/stdout cass;
    error_log /dev/stderr warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 60s;
    }

    location ^~ /storage/ {
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:" always;
        add_header X-Content-Type-Options nosniff always;
        expires 7d;
        try_files $uri =404;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        add_header X-Content-Type-Options nosniff always;
        expires 30d;
        access_log off;
        # A regex location beats the `location /` prefix, so any URI ending in
        # one of these extensions was answered from disk and 404'd by nginx
        # before PHP saw it - which is why Livewire's route-served
        # /livewire-<hash>/livewire.min.js is 404 in production today. Fall
        # through to Laravel instead; real files still win via $uri.
        try_files $uri /index.php?$query_string;
    }

    location ~ /\.(?!well-known) { deny all; }
}
