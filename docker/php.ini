memory_limit=256M
upload_max_filesize=12M
post_max_size=110M
max_execution_time=60
expose_php=Off
opcache.enable=1
opcache.validate_timestamps=0
opcache.memory_consumption=128
opcache.max_accelerated_files=20000
date.timezone=UTC
; Exception traces leave out argument values, so an abstract or an address passed down the stack
; stays out of the server log. php-fpm and the CLI both read this file (Dockerfile, conf.d).
zend.exception_ignore_args=On
