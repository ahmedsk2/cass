# Dependabot, five ecosystems, weekly, grouped.
#
# Grouped on purpose: an ungrouped run opens eleven pull requests every Monday
# for a single-maintainer repository, which is how Dependabot gets switched off.
# One PR per ecosystem is reviewable in the time somebody actually has.
version: 2

updates:
  # The Dockerfile's three base images. `directories: [/, /docker]` would be
  # wrong: docker/ holds entrypoint.sh, nginx.conf, php.ini, supervisord.conf
  # and backup.sh, and no Dockerfile at all.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Riyadh
    open-pull-requests-limit: 3
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: "chore(docker)"

  # mysql:8.4 in BOTH compose files and axllent/mailpit in the dev one. This is
  # a separate ecosystem from `docker`, which reads Dockerfiles only: with the
  # `docker` block alone the compose digests pinned in the compose files would
  # never move again, which is worse than not pinning them - the production
  # database image would silently stop receiving security updates.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Riyadh
    open-pull-requests-limit: 2
    groups:
      compose:
        patterns: ["*"]
    ignore:
      # Dependabot read 8.4 -> 26.7 as an ordinary version bump and opened #8.
      # It is not one. MySQL 26.7 is the first GA Innovation release under the
      # new calendar-versioning scheme, where the number is the release date:
      # 26.7 is "July 2026", 26.10 is October 2026. It is not a descendant of
      # 8.4, and the tag it carries on Docker Hub is `innovation`/`latest`.
      #
      # 8.4 is an LTS line and is still getting quarterly maintenance (8.4.11
      # at the time of writing), so staying here is not staying unpatched -
      # which is the only argument for taking a database major automatically.
      #
      # There is also no such upgrade: MySQL forbids skipping an LTS series, so
      # 8.4 -> 26.x has to go through 9.7 LTS first. Doing it in place means
      # pointing a 26.7 server at the 8.4 datadir on the cass-mysql volume, and
      # MySQL has no downgrade - the volume is a one-way door with the only way
      # back being a restore from a dump.
      #
      # None of that shows up in CI, which is the trap: the compose files are
      # never used by .github/workflows/ci.yml (the `test` and `smoke` jobs
      # declare their own `image: mysql:8.4` service), so a compose-only bump
      # goes green having never started the image it changed. #8 was green.
      #
      # Major moves off 8.4 are therefore a planned migration - backup, dump,
      # restore, verify - and not a Monday morning merge. Digest updates and
      # patch/minor releases within 8.4 are deliberately still allowed through,
      # because those are the security updates this ecosystem block exists for.
      - dependency-name: mysql
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(compose)"

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Riyadh
    open-pull-requests-limit: 3
    groups:
      # Laravel, Filament and Livewire move together and their tests are the
      # slowest; keeping them out of the small-change group means a red suite
      # names the framework rather than a linter.
      framework:
        patterns: ["laravel/*", "filament/*", "livewire/*"]
      dev:
        dependency-type: development
      production:
        dependency-type: production
        exclude-patterns: ["laravel/*", "filament/*", "livewire/*"]
    commit-message:
      prefix: "chore(composer)"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Riyadh
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: "chore(npm)"

  # The reason the workflow pins actions by SHA: a mutable tag on a third-party
  # action is arbitrary code in the pipeline, and this is what keeps a pinned
  # SHA current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Riyadh
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(actions)"
