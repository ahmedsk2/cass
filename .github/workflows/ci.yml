name: CI

on:
  # `push` on main only, `pull_request` for everything else. With both
  # unfiltered, every commit pushed to a branch that has a pull request open ran
  # this whole workflow twice - including the 23-minute arm64 image build -
  # for one identical tree.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  # By hand, from the Actions tab or `gh workflow run ci.yml --ref <branch>`:
  # every job, the arm64 image build included.
  workflow_dispatch:

# One run per ref at a time: pushing a fixup while the previous commit is still
# building cancels the stale run instead of queueing behind it.
# That is for pull requests. On main a new push waits for the run in progress
# instead, so every merged commit gets a complete run. GitHub keeps one waiting
# run per group, so of several quick pushes to main only the newest waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Every job runs on ubuntu-24.04 rather than ubuntu-latest: GitHub moves the
# `ubuntu-latest` label to Ubuntu 26 starting 2026-10-19, and the suite is
# verified on 24.04.
jobs:
  # Whether this run builds the arm64 image. Always on the Monday schedule and
  # on a manual run; otherwise only when the change touches what the image is
  # built from (Dockerfile, .dockerignore, docker/, the two compose files) or
  # this workflow, so that a change to the workflow exercises the image job
  # too. Full history, so that both ends of the diff are in the clone.
  changes:
    runs-on: ubuntu-24.04
    # A checkout and a git diff: seconds, normally.
    timeout-minutes: 5
    outputs:
      docker: ${{ steps.decide.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Docker inputs changed?
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # What the image is built from, and this workflow.
          inputs='^(Dockerfile|\.dockerignore|docker/.*|docker-compose\.(dev|production)\.yml|\.github/workflows/ci\.yml)$'
          docker=
          changed=
          case "$EVENT" in
            schedule | workflow_dispatch)
              echo "A $EVENT run builds the image whatever changed."
              docker=true
              ;;
            pull_request)
              git rev-parse -q --verify "refs/remotes/origin/$BASE_REF" > /dev/null ||
                git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
              changed=$(git diff --no-renames --name-only "origin/$BASE_REF...HEAD")
              ;;
            push)
              # All zeros: the push created the branch. Unknown to git: a
              # force push left it unreachable. Either way there is no diff.
              if [ "$BEFORE" = 0000000000000000000000000000000000000000 ] ||
                ! git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
                echo "No previous commit to diff against ($BEFORE): building the image."
                docker=true
              else
                changed=$(git diff --no-renames --name-only "$BEFORE" "$SHA")
              fi
              ;;
            *)
              echo "Unexpected event $EVENT: building the image."
              docker=true
              ;;
          esac
          if [ -z "$docker" ]; then
            echo "Changed paths:"
            printf '%s\n' "$changed" | sed 's/^/  /'
            if hits=$(printf '%s\n' "$changed" | grep -E "$inputs"); then
              echo "Docker inputs among them:"
              printf '%s\n' "$hits" | sed 's/^/  /'
              docker=true
            else
              echo "No Docker input among them."
              docker=false
            fi
          fi
          echo "docker=$docker"
          echo "docker=$docker" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-24.04
    # About five minutes. The cap is for a hung MySQL service or test, which
    # would otherwise hold a paid runner for GitHub's six-hour default.
    timeout-minutes: 20
    services:
      mysql:
        # The image both compose files pin, digest and all. The `scripts` job
        # fails the run when the three drift apart.
        image: mysql:8.4@sha256:0744ee5ef89ce6ccfa13de3e579fe6b9e27f93dd70da9c06d2c908b1b193fb8d
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cass_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          # sockets: pestphp/pest-plugin-browser requires ext-sockets, so a
          # plain `composer install` fails the platform check without it even
          # though this job never runs a browser test.
          extensions: mbstring, intl, gd, zip, pdo_mysql, sqlite3, pdo_sqlite, sockets
          coverage: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      # Composer's download cache, keyed on composer.lock: with the archives
      # restored, `composer install` unpacks them instead of downloading every
      # package again.
      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - run: npm run build
      - run: cp .env.example .env && php artisan key:generate
      - name: Pint
        run: ./vendor/bin/pint --test
      - name: Larastan
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Tests (SQLite)
        run: php artisan test --compact
      - name: Tests (MySQL)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: cass_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test --compact

  # The two host-side backup scripts. They are shell, not PHP, so `php artisan
  # test` cannot see them - and the bug they exist to prevent (identifying the
  # Coolify-named containers by a `grep -i cass` over their names, which matched
  # nothing on the production host and silently skipped every nightly backup) is
  # exactly the kind only an execution test catches. Deliberately cheap: no PHP,
  # no node, no services, no docker - backup.test.sh puts a fake `docker` on
  # PATH. `sh` on ubuntu is dash, so this also proves the scripts are POSIX.
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shell syntax
        run: sh -n docker/backup.sh docker/storage-backup.sh docker/entrypoint.sh docker/backup.test.sh
      - name: Backup container detection
        run: sh docker/backup.test.sh
      # The Claude Code production guard and the pre-push hook that stands in
      # for branch protection. The runner's preinstalled Node is enough.
      - name: Guardrail hooks
        run: node --test .claude/hooks/guard-production.test.mjs tools/git-hooks/pre-push.test.mjs
      # The MySQL service in `test` and `smoke` is pinned to the digest both
      # compose files pin. Dependabot moves the compose digest but never a
      # workflow's service image, so a compose bump alone fails here until this
      # file carries the same digest. Under `sh`, like the scripts above.
      - name: MySQL digest in step with the compose files
        shell: sh
        run: |
          refs=$(grep -oE 'mysql:8\.4@sha256:[0-9a-f]{64}' .github/workflows/ci.yml docker-compose.dev.yml docker-compose.production.yml || true)
          printf '%s\n' "$refs"
          count=$(printf '%s\n' "$refs" | grep -c . || true)
          distinct=$(printf '%s\n' "$refs" | sed -n 's/.*@//p' | sort -u | grep -c . || true)
          if [ "$count" -ne 4 ] || [ "$distinct" -ne 1 ]; then
            echo "::error::$count mysql:8.4@sha256 references with $distinct distinct digests in .github/workflows/ci.yml, docker-compose.dev.yml and docker-compose.production.yml; expected four (the test and smoke service images in ci.yml, the mysql image in each compose file) and one digest. A Dependabot PR that moves the compose digest needs the same digest in ci.yml's two service images."
            exit 1
          fi
          echo "Four references, one digest."

  # Spec section 12's one end-to-end browser run. Its own job so the `test` job
  # stays fast and so a Playwright flake never hides a real unit failure. No
  # MySQL service: phpunit.browser.xml pins SQLite in memory, and the `test`
  # job already runs the whole suite against MySQL 8.4.
  browser:
    runs-on: ubuntu-24.04
    needs: test
    # A hung amphp server or a Playwright wait that never resolves is the
    # failure mode this job is most exposed to, and GitHub's default is six
    # hours of a paid runner sitting on it. The whole job takes about four
    # minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, zip, sqlite3, pdo_sqlite, sockets
          coverage: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      # The same Composer download cache as the `test` job.
      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      # The browsers themselves, plus the shared libraries Chromium needs on a
      # bare runner. Only chromium: the suite has one test and three engines
      # would triple the job for nothing.
      - run: npx playwright install --with-deps chromium
      # The page is rendered by Blade with @vite, so the manifest has to exist
      # or every request 500s on ViteManifestNotFoundException.
      - run: npm run build
      - run: cp .env.example .env && php artisan key:generate
      - name: Browser test
        run: ./vendor/bin/pest --configuration=phpunit.browser.xml
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-screenshots
          path: tests/Browser/Screenshots
          if-no-files-found: ignore

  # The arm64 build under QEMU takes about 33 minutes and only proves something
  # when its inputs changed, so it runs when the `changes` job says they did.
  # The `smoke` job builds the same Dockerfile for amd64 on every run.
  image:
    runs-on: ubuntu-24.04
    needs: [test, changes]
    if: needs.changes.outputs.docker == 'true'
    # About 33 minutes, so twelve minutes of headroom.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build arm64 image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: false
          tags: cass:ci

  smoke:
    runs-on: ubuntu-24.04
    needs: test
    # About four minutes, most of it the amd64 image build.
    timeout-minutes: 20
    services:
      mysql:
        # The same pinned image as the `test` job's service.
        image: mysql:8.4@sha256:0744ee5ef89ce6ccfa13de3e579fe6b9e27f93dd70da9c06d2c908b1b193fb8d
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cass
          MYSQL_USER: cass
          MYSQL_PASSWORD: cass
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build amd64 image
        run: docker build -t cass:smoke .
      - name: Run container
        run: |
          docker run -d --name cass --network host \
            -e APP_KEY=base64:$(openssl rand -base64 32) -e APP_URL=http://localhost:8080 -e APP_ENV=production -e APP_DEBUG=false \
            -e DB_CONNECTION=mysql -e DB_HOST=127.0.0.1 -e DB_USERNAME=cass -e DB_PASSWORD=cass -e DB_DATABASE=cass \
            -e QUEUE_CONNECTION=database -e CACHE_STORE=database -e SESSION_DRIVER=database -e MAIL_MAILER=log \
            -e CASS_ADMIN_EMAIL=admin@example.org -e CASS_ADMIN_PASSWORD=smoke-test-password-1 cass:smoke
          for i in $(seq 1 30); do curl -sf -H 'Host: localhost' http://127.0.0.1:8080/up && break; sleep 2; done
          docker exec cass su-exec app php artisan migrate --force
      - name: Assertions
        run: |
          set -e
          curl -sf -o /dev/null -H 'Host: localhost' http://127.0.0.1:8080/up
          curl -sf -o /dev/null -H 'Host: localhost' http://127.0.0.1:8080/
          code=$(head -c 65536 /dev/urandom | base64 | curl -s -o /dev/null -w '%{http_code}' -H 'Host: localhost' -X POST --data-binary @- http://127.0.0.1:8080/register)
          echo "64KB POST -> $code"; test "$code" != "500"
          # BusyBox Alpine has no `ss`; netstat is present. php-fpm must be
          # loopback-only (no 0.0.0.0:9000).
          docker exec cass sh -c 'netstat -tln' | tee /tmp/ports
          ! grep -E ':9000 ' /tmp/ports | grep -vq '127.0.0.1'
          # `ps -o user,comm` truncates to bare binary names on BusyBox
          # (no way to tell a worker from a master process), so use
          # `ps aux`, which prints the full command ("nginx: worker
          # process", "php-fpm: pool www", the artisan queue/schedule
          # commands) and assert none of those are root-owned - column 2
          # is USER in BusyBox's `PID USER TIME COMMAND` layout.
          docker exec cass sh -c 'ps aux' | tee /tmp/ps
          ! awk '$2 == "root"' /tmp/ps | grep -E 'worker process|pool www|artisan'
          # The panel is unusable without these; they are git-ignored and only
          # exist because the image publishes them at build time.
          curl -sf -o /dev/null -H 'Host: localhost' http://127.0.0.1:8080/css/filament/filament/app.css
          curl -sf -o /dev/null -H 'Host: localhost' http://127.0.0.1:8080/js/filament/filament/app.js
          curl -sf -o /dev/null -H 'Host: localhost' http://127.0.0.1:8080/vendor/livewire/livewire.min.js
          # The third panel (Plan 4) inside the built image, under route:cache +
          # config:cache + opcache validate_timestamps=0. A guest on /review must
          # be redirected to the reviewer login, not 500. The command's own
          # registration is already covered by
          # tests/Feature/ReviewerRemindersTest.php and by `schedule:list`, so it
          # is not repeated here.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: localhost' http://127.0.0.1:8080/review)
          echo "reviewer panel -> $code"; test "$code" = "302"
          curl -sf -o /dev/null -H 'Host: localhost' http://127.0.0.1:8080/review/login
          # The Plan 5 page inside the built image, under route:cache +
          # config:cache + opcache validate_timestamps=0. route:cache runs in the
          # entrypoint, so a page registered with the wrong parameters would
          # either have failed the boot or be missing from the cached table.
          # (A curl of /org would prove nothing here: that route resolves to
          # Filament's RedirectToTenantController and never reaches the ranking.)
          docker exec cass su-exec app php artisan route:list --except-vendor | tee /tmp/routes
          grep -q 'conferences/{record}/ranking' /tmp/routes
          # And a guest on it is redirected to the organizer login, not 500:
          # Filament's Authenticate middleware runs before IdentifyTenant
          # (vendor/filament/filament/routes/web.php:60 vs :119), so the tenant
          # slug is never resolved and need not exist.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: localhost' http://127.0.0.1:8080/org/any-org/conferences/01ARZ3NDEKTSV4RRFFQ69G5FAV/ranking)
          echo "ranking page -> $code"; test "$code" = "302"
          # A guest on an authenticated asset route reaches PHP and is sent to
          # the organizer login (redirectGuestsTo in bootstrap/app.php). This
          # URI has no dot extension, so the static-extension location never
          # sees it - it proves the route and the redirect, nothing about nginx.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: localhost' http://127.0.0.1:8080/conference-assets/01ARZ3NDEKTSV4RRFFQ69G5FAV/qr-svg)
          echo "asset route -> $code"; test "$code" = "302"
          # A URI that DOES end in a static extension with no file on disk must
          # fall through to Laravel instead of being 404'd from disk by the
          # regex location in docker/nginx.conf - the bug that kept Livewire's
          # /livewire-<hash>/livewire.min.js 404 in production. Both answers are
          # a 404, so tell them apart by a header only Laravel sends:
          # X-Content-Type-Options is no use because nginx sends it as well.
          curl -sI -H 'Host: localhost' http://127.0.0.1:8080/nonexistent-probe.css | tee /tmp/fallthrough
          grep -qi '^x-frame-options: DENY' /tmp/fallthrough
          # dompdf inside the production image as the php-fpm user: bundled
          # TTFs present, storage/fonts writable by app, GD/CPDF work on Alpine.
          docker exec cass su-exec app php -r '
            require "vendor/autoload.php";
            $app = require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $pdf = Barryvdh\DomPDF\Facade\Pdf::loadHTML("<p style=\"font-family: IBM Plex Sans; font-weight: bold\">CASS</p>");
            App\Support\Pdf\PosterFonts::register($pdf->getDomPDF());
            exit(str_starts_with($pdf->output(), "%PDF-") ? 0 : 1);'
          docker exec cass test -s storage/fonts/installed-fonts.json
          # The CSP inside the built image, under route:cache + config:cache +
          # opcache validate_timestamps=0. The header is built in PHP, so this
          # is also the check that CASS_CSP_REPORT_ONLY defaults to enforcing.
          curl -sD /tmp/csp -o /dev/null -H 'Host: localhost' http://127.0.0.1:8080/
          grep -qi '^content-security-policy:' /tmp/csp
          grep -qi 'nonce-' /tmp/csp
          ! grep -qi '^content-security-policy-report-only:' /tmp/csp
          grep -qi '^cross-origin-opener-policy: same-origin' /tmp/csp
          # The panel login, which is the page the published Filament views
          # serve: a Blade error in either of them is a 500 here. Headers AND
          # body from ONE request - the nonce is minted per request, so taking
          # it from a separate `curl -I` compares two different nonces and can
          # only ever fail.
          curl -sf -D /tmp/login-h -o /tmp/login -H 'Host: localhost' http://127.0.0.1:8080/org/login
          grep -q 'window.filamentData' /tmp/login
          NONCE=$(grep -oiE "nonce-[A-Za-z0-9]{40}" /tmp/login-h | head -1 | cut -d'-' -f2)
          test -n "$NONCE"
          # Every inline script and style in that page carries the same nonce
          # the header does - a mismatch is a panel with no JavaScript at all.
          grep -q "nonce=\"$NONCE\"" /tmp/login
          # The panel theme, built in the image's assets stage: the login page
          # links it under the same nonce, nginx serves it, and it carries a
          # utility only a panel view uses (the organizer dashboard's dark-mode
          # banner). An assets stage without vendor/filament fails the build
          # before this line; one whose theme stopped reaching the panel views
          # builds green and fails here.
          THEME=$(grep -oE '/build/assets/theme-[A-Za-z0-9_-]+\.css' /tmp/login | head -1)
          test -n "$THEME"
          grep -qE "href=\"[^\"]*$THEME\" nonce=\"$NONCE\"" /tmp/login
          curl -sf -o /tmp/theme.css -H 'Host: localhost' "http://127.0.0.1:8080$THEME"
          grep -qF '.dark\:bg-amber-950' /tmp/theme.css
      - if: always()
        run: docker logs cass | tail -50
