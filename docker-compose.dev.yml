services:
  mysql:
    # Same multi-architecture index digest as docker-compose.production.yml, so
    # the local MySQL suite runs against the image production runs.
    image: mysql:8.4@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cass
      MYSQL_USER: cass
      MYSQL_PASSWORD: cass
    ports:
      - "3306:3306"
    volumes:
      - cass-mysql-dev:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    # latest as of 2026-09-12, pinned by index digest. A floating `latest` in a
    # development compose file is how two developers end up with different
    # Mailpits and one of them cannot reproduce a bug.
    image: axllent/mailpit:latest@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  cass-mysql-dev:
