services:
  mysql:
    # Same multi-architecture index digest as docker-compose.production.yml, so
    # the local MySQL suite runs against the image production runs.
    image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cass
      MYSQL_USER: cass
      MYSQL_PASSWORD: cass
    ports:
      - "3306:3306"
    volumes:
      - cass-mysql-dev:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    # latest as of 2026-09-12, pinned by index digest. A floating `latest` in a
    # development compose file is how two developers end up with different
    # Mailpits and one of them cannot reproduce a bug.
    image: axllent/mailpit:latest@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  cass-mysql-dev:
